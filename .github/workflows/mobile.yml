name: Mobile

on:
  push:
    branches: ['codex/mobile-*']
  pull_request:
    branches: ['codex/mobile-ui-loop']

permissions:
  contents: read

jobs:
  mobile-test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-mobile
